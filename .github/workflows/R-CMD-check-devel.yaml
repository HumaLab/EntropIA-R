# R-devel matrix, run off the push critical path.
#
# R-devel on macOS/Ubuntu takes 30-40 min per job, which dominates CI minutes.
# devel is checked here on a schedule (2x/week, after CRAN's daily devel
# snapshot) and on demand via workflow_dispatch, instead of gating every push.
# release/oldrel still run on every push in R-CMD-check.yaml.
on:
  schedule:
    - cron: '17 5 * * 3,0'
  workflow_dispatch:

name: R-CMD-check-devel

permissions: read-all

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: devel, http-user-agent: 'release'}
          - {os: windows-latest, r: devel, http-user-agent: 'release'}
          - {os: macos-latest,   r: devel, http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Test fixtures are deterministic generated artifacts (gitignored), so
      # they are rebuilt here rather than committed. See data-raw/make_fixtures.R.
      - name: Generate test fixtures
        run: Rscript data-raw/make_fixtures.R

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
